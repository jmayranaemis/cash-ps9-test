# Ultimate Image Tool runs behind PHP-FPM, so its Apache .htaccess rules are not
# evaluated. These maps let Nginx prefer the generated AVIF/WebP derivative only
# when the browser advertises support, with the original image as final fallback.
map $http_accept $uit_avif_suffix {
    default "";
    ~*image/avif ".avif";
}

map $http_accept $uit_webp_suffix {
    default "";
    ~*image/webp ".webp";
}

server {
    listen 80;
    server_name test.cash-alimentaire.com;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 64M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;

    # Back Office PrestaShop : indispensable pour les URLs Symfony du BO
    location /admin147sm4znpz7kccmqpta/ {
        try_files $uri $uri/ /admin147sm4znpz7kccmqpta/index.php$is_args$args;
    }

    # Front Office
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # PrestaShop product image friendly URLs.
    # The physical files live in /img/p/<one directory per image-id digit>/.
    location ~ ^/(?<a1>[0-9])(?<asuffix>-[_a-zA-Z0-9-]*)?(?<aretina>-[0-9]+)?/[^/]+\.(?<aext>jpe?g|png|webp|avif)$ {
        add_header Vary "Accept" always;
        try_files /img/p/$a1/$a1$asuffix$aretina$uit_avif_suffix /img/p/$a1/$a1$asuffix$aretina$uit_webp_suffix /img/p/$a1/$a1$asuffix$aretina.$aext =404;
    }

    location ~ ^/(?<b1>[0-9])(?<b2>[0-9])(?<bsuffix>-[_a-zA-Z0-9-]*)?(?<bretina>-[0-9]+)?/[^/]+\.(?<bext>jpe?g|png|webp|avif)$ {
        add_header Vary "Accept" always;
        try_files /img/p/$b1/$b2/$b1$b2$bsuffix$bretina$uit_avif_suffix /img/p/$b1/$b2/$b1$b2$bsuffix$bretina$uit_webp_suffix /img/p/$b1/$b2/$b1$b2$bsuffix$bretina.$bext =404;
    }

    location ~ ^/(?<c1>[0-9])(?<c2>[0-9])(?<c3>[0-9])(?<csuffix>-[_a-zA-Z0-9-]*)?(?<cretina>-[0-9]+)?/[^/]+\.(?<cext>jpe?g|png|webp|avif)$ {
        add_header Vary "Accept" always;
        try_files /img/p/$c1/$c2/$c3/$c1$c2$c3$csuffix$cretina$uit_avif_suffix /img/p/$c1/$c2/$c3/$c1$c2$c3$csuffix$cretina$uit_webp_suffix /img/p/$c1/$c2/$c3/$c1$c2$c3$csuffix$cretina.$cext =404;
    }

    location ~ ^/(?<d1>[0-9])(?<d2>[0-9])(?<d3>[0-9])(?<d4>[0-9])(?<dsuffix>-[_a-zA-Z0-9-]*)?(?<dretina>-[0-9]+)?/[^/]+\.(?<dext>jpe?g|png|webp|avif)$ {
        add_header Vary "Accept" always;
        try_files /img/p/$d1/$d2/$d3/$d4/$d1$d2$d3$d4$dsuffix$dretina$uit_avif_suffix /img/p/$d1/$d2/$d3/$d4/$d1$d2$d3$d4$dsuffix$dretina$uit_webp_suffix /img/p/$d1/$d2/$d3/$d4/$d1$d2$d3$d4$dsuffix$dretina.$dext =404;
    }

    location ~ ^/(?<e1>[0-9])(?<e2>[0-9])(?<e3>[0-9])(?<e4>[0-9])(?<e5>[0-9])(?<esuffix>-[_a-zA-Z0-9-]*)?(?<eretina>-[0-9]+)?/[^/]+\.(?<eext>jpe?g|png|webp|avif)$ {
        add_header Vary "Accept" always;
        try_files /img/p/$e1/$e2/$e3/$e4/$e5/$e1$e2$e3$e4$e5$esuffix$eretina$uit_avif_suffix /img/p/$e1/$e2/$e3/$e4/$e5/$e1$e2$e3$e4$e5$esuffix$eretina$uit_webp_suffix /img/p/$e1/$e2/$e3/$e4/$e5/$e1$e2$e3$e4$e5$esuffix$eretina.$eext =404;
    }

    location ~ ^/(?<f1>[0-9])(?<f2>[0-9])(?<f3>[0-9])(?<f4>[0-9])(?<f5>[0-9])(?<f6>[0-9])(?<fsuffix>-[_a-zA-Z0-9-]*)?(?<fretina>-[0-9]+)?/[^/]+\.(?<fext>jpe?g|png|webp|avif)$ {
        add_header Vary "Accept" always;
        try_files /img/p/$f1/$f2/$f3/$f4/$f5/$f6/$f1$f2$f3$f4$f5$f6$fsuffix$fretina$uit_avif_suffix /img/p/$f1/$f2/$f3/$f4/$f5/$f6/$f1$f2$f3$f4$f5$f6$fsuffix$fretina$uit_webp_suffix /img/p/$f1/$f2/$f3/$f4/$f5/$f6/$f1$f2$f3$f4$f5$f6$fsuffix$fretina.$fext =404;
    }

    # Image IDs longer than six digits use named captures to avoid Nginx's $10
    # ambiguity.
    location ~ ^/(?<i1>[0-9])(?<i2>[0-9])(?<i3>[0-9])(?<i4>[0-9])(?<i5>[0-9])(?<i6>[0-9])(?<i7>[0-9])(?<isuffix>-[_a-zA-Z0-9-]*)?(?<iretina>-[0-9]+)?/[^/]+\.(?<iext>jpe?g|png|webp|avif)$ {
        add_header Vary "Accept" always;
        try_files /img/p/$i1/$i2/$i3/$i4/$i5/$i6/$i7/$i1$i2$i3$i4$i5$i6$i7$isuffix$iretina$uit_avif_suffix /img/p/$i1/$i2/$i3/$i4/$i5/$i6/$i7/$i1$i2$i3$i4$i5$i6$i7$isuffix$iretina$uit_webp_suffix /img/p/$i1/$i2/$i3/$i4/$i5/$i6/$i7/$i1$i2$i3$i4$i5$i6$i7$isuffix$iretina.$iext =404;
    }

    location ~ ^/(?<j1>[0-9])(?<j2>[0-9])(?<j3>[0-9])(?<j4>[0-9])(?<j5>[0-9])(?<j6>[0-9])(?<j7>[0-9])(?<j8>[0-9])(?<jsuffix>-[_a-zA-Z0-9-]*)?(?<jretina>-[0-9]+)?/[^/]+\.(?<jext>jpe?g|png|webp|avif)$ {
        add_header Vary "Accept" always;
        try_files /img/p/$j1/$j2/$j3/$j4/$j5/$j6/$j7/$j8/$j1$j2$j3$j4$j5$j6$j7$j8$jsuffix$jretina$uit_avif_suffix /img/p/$j1/$j2/$j3/$j4/$j5/$j6/$j7/$j8/$j1$j2$j3$j4$j5$j6$j7$j8$jsuffix$jretina$uit_webp_suffix /img/p/$j1/$j2/$j3/$j4/$j5/$j6/$j7/$j8/$j1$j2$j3$j4$j5$j6$j7$j8$jsuffix$jretina.$jext =404;
    }

    # Category image friendly URLs use /c/<id>-<image-type>/<slug>.<ext>.
    location ~ ^/c/(?<catid>[0-9]+)(?<catthumb>_thumb)?(?<catsuffix>-[_a-zA-Z0-9-]+)?(?<catretina>-[0-9]+)?/[^/]+\.(?<catext>jpe?g|png|webp|avif)$ {
        add_header Vary "Accept" always;
        try_files /img/c/$catid$catthumb$catsuffix$catretina$uit_avif_suffix /img/c/$catid$catthumb$catsuffix$catretina$uit_webp_suffix /img/c/$catid$catthumb$catsuffix$catretina.$catext =404;
    }

    # PHP-FPM avec PATH_INFO, nécessaire pour BO PrestaShop
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;

        try_files $fastcgi_script_name =404;

        fastcgi_pass cash_ps9_test_php:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT $document_root;

        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_NAME $host;

        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_SSL on;

        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    location ~ /\. {
        deny all;
    }

    location ~* ^/(app|bin|cache|classes|config|controllers|docs|download|localization|override|src|tests|tools|translations|var|vendor)/ {
        deny all;
    }

    location ~* \.(tpl|twig|sass|yml|yaml|ini|log|sh|sql)$ {
        deny all;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}
