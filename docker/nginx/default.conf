server {
    listen 80;
    server_name test.cash-alimentaire.com;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 64M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;

    # Back Office PrestaShop : indispensable pour les URLs Symfony du BO
    location /admin147sm4znpz7kccmqpta/ {
        try_files $uri $uri/ /admin147sm4znpz7kccmqpta/index.php$is_args$args;
    }

    # Front Office
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # PHP-FPM avec PATH_INFO, nécessaire pour BO PrestaShop
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;

        try_files $fastcgi_script_name =404;

        fastcgi_pass cash_ps9_test_php:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT $document_root;

        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_NAME $host;

        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_SSL on;

        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    location ~ /\. {
        deny all;
    }

    location ~* ^/(app|bin|cache|classes|config|controllers|docs|download|localization|override|src|tests|tools|translations|var|vendor)/ {
        deny all;
    }

    location ~* \.(tpl|twig|sass|yml|yaml|ini|log|sh|sql)$ {
        deny all;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}
