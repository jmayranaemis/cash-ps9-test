name: Deploy to PROD

# Déploiement en production, UNIQUEMENT à la main (bouton « Run workflow »
# dans VS Code ou sur GitHub). Jamais déclenché par un push.
#
# Volontairement ciblé : on déploie UN module (ou le thème) à la fois, jamais
# tout modules/ ni override/. La prod a reçu des correctifs posés directement
# sur le serveur (override Link.php le 07/10, lpsflipbook le 18/11) : un rsync
# global les écraserait.
#
# Toujours lancer d'abord avec « simulation » coché : le journal liste les
# fichiers qui seraient modifiés, sans rien toucher.

on:
  workflow_dispatch:
    inputs:
      cible:
        description: "Module à déployer (ex. cashhomepage) ou « theme »"
        required: true
        default: cashhomepage
      simulation:
        description: "Simulation : lister les changements sans rien écrire"
        type: boolean
        default: true
      confirmation:
        description: "Pour un vrai déploiement, taper PROD"
        required: false
        default: ""
      scripts_de_mise_a_jour:
        description: "Accepter les scripts de mise à jour du module listés par la simulation (ils peuvent modifier la base)"
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Environnement GitHub « test » : uniquement pour lire les secrets SSH,
    # communs à test et prod (même VPS, même clé). La cible réelle est fixée
    # plus bas (ROOT, C) et ne dépend d'aucun secret.
    environment:
      name: test
      url: https://www.cash-alimentaire.com

    # Valeurs propres à la prod, écrites ici : ce ne sont pas des secrets, et
    # les avoir en clair évite toute confusion avec celles de test.
    # Seuls SSH_HOST, SSH_USER et SSH_KEY viennent des secrets GitHub.
    env:
      CIBLE: ${{ inputs.cible }}
      SIMULATION: ${{ inputs.simulation }}
      ROOT: /srv/www/cash-ps9-prod
      C: cash_ps9_prod_php
      HEALTHCHECK_URL: https://www.cash-alimentaire.com/

    steps:
      - name: Contrôles avant déploiement
        env:
          HAS_KEY: ${{ secrets.SSH_KEY != '' && 'oui' || '' }}
          HAS_HOST: ${{ secrets.SSH_HOST }}
          HAS_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e
          case "$GITHUB_REF_NAME" in
            develop|main) ;;
            *) echo "::error::Branche $GITHUB_REF_NAME refusée : lancer depuis develop ou main." ; exit 1 ;;
          esac
          if ! echo "$CIBLE" | grep -Eq '^[a-z0-9_]+$'; then
            echo "::error::Cible invalide : $CIBLE" ; exit 1
          fi
          if [ "$SIMULATION" != "true" ] && [ "${{ inputs.confirmation }}" != "PROD" ]; then
            echo "::error::Vrai déploiement demandé sans la confirmation PROD." ; exit 1
          fi
          if [ -z "$HAS_KEY" ] || [ -z "$HAS_HOST" ] || [ -z "$HAS_USER" ]; then
            echo "::error::Secrets SSH_HOST / SSH_USER / SSH_KEY introuvables dans l'environnement GitHub test." ; exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Déterminer les dossiers
        id: paths
        run: |
          set -e
          if [ "$CIBLE" = "theme" ]; then
            SRC="themes/grainfoodmarket/"
            DST="themes/grainfoodmarket/"
          else
            SRC="modules/$CIBLE/"
            DST="modules/$CIBLE/"
          fi
          test -d "$SRC" || { echo "::error::$SRC n'existe pas dans le dépôt." ; exit 1 ; }
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          echo "dst=$DST" >> "$GITHUB_OUTPUT"

      - name: Clé SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sentinelle et conteneur
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
            set -e
            test -f '$ROOT/.allow-ci-sync' || { echo 'Pas de sentinelle .allow-ci-sync en prod, arrêt' ; exit 1 ; }
            docker ps --format '{{.Names}}' | grep -qx '$C' || { echo 'Conteneur PHP prod arrêté : $C' ; exit 1 ; }
          "

      - name: Version du module en prod et scripts de mise à jour
        id: version
        if: ${{ inputs.cible != 'theme' }}
        run: |
          set -e
          REPO_VERSION=$(grep -oP "this->version\s*=\s*'\K[^']+" "modules/$CIBLE/$CIBLE.php" | head -1)
          printf '%s\n' '<?php' \
            'require "/var/www/html/config/config.inc.php";' \
            "echo (string) Db::getInstance()->getValue(\"SELECT version FROM \" . _DB_PREFIX_ . \"module WHERE name = '$CIBLE'\");" \
            > version.php
          PROD_VERSION=$(ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "docker exec -i -u www-data $C php" < version.php | tail -1)
          SCRIPTS=""
          if [ -d "modules/$CIBLE/upgrade" ] && [ -n "$PROD_VERSION" ]; then
            for f in $(ls "modules/$CIBLE/upgrade" | grep -E '^upgrade-[0-9.]+\.php$' | sort -V); do
              v=$(echo "$f" | sed -E 's/^upgrade-([0-9.]+)\.php$/\1/')
              # script exécuté par PrestaShop si version prod < v <= version dépôt
              if [ "$(printf '%s\n%s\n' "$PROD_VERSION" "$v" | sort -V | head -1)" = "$PROD_VERSION" ] && [ "$v" != "$PROD_VERSION" ] \
                 && [ "$(printf '%s\n%s\n' "$v" "$REPO_VERSION" | sort -V | tail -1)" = "$REPO_VERSION" ]; then
                SCRIPTS="$SCRIPTS $f"
              fi
            done
          fi
          echo "scripts=$SCRIPTS" >> "$GITHUB_OUTPUT"
          {
            echo "### Version de \`$CIBLE\`"
            echo "- en prod : **${PROD_VERSION:-non installé}**"
            echo "- dans le dépôt : **$REPO_VERSION**"
            if [ -n "$SCRIPTS" ]; then
              echo ""
              echo "⚠️ **Scripts de mise à jour que PrestaShop exécuterait** — ils peuvent modifier la base (pages CMS, menus…) :"
              for f in $SCRIPTS; do echo "- \`$f\`"; done
              echo ""
              echo "Le vrai déploiement s'arrêtera sans rien copier, sauf si « scripts_de_mise_a_jour » est coché."
            else
              echo "- aucun script de mise à jour à exécuter"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Arrêt si scripts de mise à jour non acceptés
        if: ${{ inputs.simulation == false && steps.version.outputs.scripts != '' && inputs.scripts_de_mise_a_jour == false }}
        run: |
          echo "::error::Des scripts de mise à jour du module seraient exécutés en prod (voir la simulation). Rien n'a été copié."
          exit 1

      - name: Synchronisation (simulation = liste seule)
        run: |
          set -e
          DRY=""
          [ "$SIMULATION" = "true" ] && DRY="--dry-run"
          SRC="${{ steps.paths.outputs.src }}"
          DEST="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$ROOT/${{ steps.paths.outputs.dst }}"
          COMMUN=(-rlz --checksum --itemize-changes $DRY --no-perms --no-owner --no-group
                  --exclude '.git/' --exclude '*.bak' --exclude '*.bak.*' --exclude '*~'
                  --exclude '.DS_Store' --exclude 'vendor/' --exclude 'node_modules/'
                  -e "ssh -i $HOME/.ssh/id_deploy")
          IMAGES=(--include '*/' --include '*.webp' --include '*.jpg' --include '*.jpeg'
                  --include '*.png' --include '*.gif' --include '*.svg' --include '*.ico' --exclude '*')

          # 1. Tout sauf les images. Pas de --delete : rien n'est jamais supprimé en prod.
          rsync "${COMMUN[@]}" \
            --exclude '*.webp' --exclude '*.jpg' --exclude '*.jpeg' --exclude '*.png' \
            --exclude '*.gif' --exclude '*.svg' --exclude '*.ico' \
            "$SRC" "$DEST" | grep -E '^[<>ch.*]' > code.log || true

          # 2. Les images : seulement celles qui n'existent pas encore en prod.
          #    Une image déjà en prod n'est JAMAIS remplacée : elle a pu être
          #    changée sur le serveur (photos remplacées à la main).
          rsync "${COMMUN[@]}" --ignore-existing --prune-empty-dirs "${IMAGES[@]}" \
            "$SRC" "$DEST" | grep -E '^[<>ch.*]' | grep -v '/$' > images.log || true

          # Pour information : images qui diffèrent entre le dépôt et la prod,
          # laissées telles quelles en prod.
          rsync "${COMMUN[@]}" --dry-run --existing --prune-empty-dirs "${IMAGES[@]}" \
            "$SRC" "$DEST" | grep -E '^[<>ch.*]' | grep -v '/$' > images-differentes.log || true

          {
            echo "### ${CIBLE} — $([ "$SIMULATION" = "true" ] && echo 'SIMULATION, rien n’a été écrit' || echo 'DÉPLOYÉ')"
            echo ""
            echo "**Fichiers $([ "$SIMULATION" = "true" ] && echo 'qui seraient remplacés' || echo 'remplacés') :**"
            echo '```'
            [ -s code.log ] && cat code.log || echo "aucun"
            echo '```'
            echo "**Images nouvelles $([ "$SIMULATION" = "true" ] && echo 'qui seraient ajoutées' || echo 'ajoutées') :**"
            echo '```'
            [ -s images.log ] && cat images.log || echo "aucune"
            echo '```'
            if [ -s images-differentes.log ]; then
              echo "**Images différentes en prod, conservées telles quelles (jamais écrasées) :**"
              echo '```'
              cat images-differentes.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Droits, mise à jour du module, cache
        if: ${{ inputs.simulation == false }}
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
            set -e
            docker exec '$C' chown -R www-data:www-data /var/www/html/${{ steps.paths.outputs.dst }}
            if [ '$CIBLE' != 'theme' ]; then
              docker exec -u www-data '$C' php -d memory_limit=1G bin/console prestashop:module upgrade '$CIBLE' || echo 'Mise à jour du module à faire depuis le back-office'
            fi
            docker exec -u www-data '$C' php -d memory_limit=1G bin/console cache:clear --no-warmup
            docker exec -u www-data '$C' php -d memory_limit=1G bin/console cache:warmup --no-optional-warmers
          "

      - name: Healthcheck
        if: ${{ inputs.simulation == false }}
        run: |
          curl -fsSL -o /dev/null -w "%{http_code}\n" "$HEALTHCHECK_URL" | grep -E "200|301|302"
